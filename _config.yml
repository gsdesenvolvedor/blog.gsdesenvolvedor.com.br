theme: jekyll-theme-chirpy

baseurl: ""

lang: pt-BR

timezone: America/Sao_Paulo

title: "blog/acervo."

tagline: "@gsdesenvolvedor"

description: >-
  Blog para compartilhamento de projetos desenvolvidos e experiências técnicas.

url: "https://blog.gsdesenvolvedor.com.br"

github:
  username: gsdesenvolvedor

twitter:
  username: gsdesenvolvedor

social:
  name: "@gsdesenvolvedor"
  email: "contato@gsdesenvolvedor.com.br"
  links:
    - https://twitter.com/gsdesenvolvedor
    - https://github.com/gsdesenvolvedor

google_site_verification:

google_analytics:
  id:
  pv:
    proxy_endpoint:
    cache_path:

theme_mode: light

img_cdn: "https://raw.githubusercontent.com/gsdesenvolvedor/gsdesenvolvedor-cdn/refs/heads/main/logos/"

avatar: logo.png

toc: true

comments:
  active:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled: true
    env:
      - production

pwa:
  enabled: true

paginate: 10

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

  - scope:
      path: assets/img/favicons
    values:
      swcache: true

  - scope:
      path: assets/js/dist
    values:
      swcache: true

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs:
      - development

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - CHANGELOG.md
  - LICENSE
  - rollup.config.js
  - node_modules
  - package*.json

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
